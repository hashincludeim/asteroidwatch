<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asteroid Watch · What’s flying by Earth today</title>
  <meta name="description" content="A live 3D dashboard of near-Earth asteroids passing Earth each day, powered by NASA's NeoWs API.">
  <meta name="theme-color" content="#03050b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%234fd8ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%23a9c8ff' stroke-width='1.6' transform='rotate(-28 16 16)'/%3E%3Ccircle cx='27' cy='9.5' r='2.4' fill='%23ff5a5f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4L12 3.5Z"/><path d="M12 10v4.5"/><path d="M12 17.2v.1"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.2 7 9.5 4-1.3 7-5 7-9.5V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12 8 5.2Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.3"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4.8" transform="rotate(-25 12 12)"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.8-6.3"/><path d="M20.5 3.5v5h-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.8v.1"/></symbol>
  </svg>

  <div id="scene"></div>

  <div class="hud">
    <header class="topbar glass">
      <a class="brand" href="./" aria-label="Asteroid Watch home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <radialGradient id="bm-earth" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#9ff0ff"/><stop offset=".55" stop-color="#2a8fe0"/><stop offset="1" stop-color="#0b2a66"/></radialGradient>
          </defs>
          <ellipse cx="20" cy="20" rx="17" ry="7.5" fill="none" stroke="rgba(170,200,255,.55)" stroke-width="1.3" transform="rotate(-28 20 20)"/>
          <circle cx="20" cy="20" r="7.5" fill="url(#bm-earth)"/>
          <circle cx="33.6" cy="12.4" r="2.6" fill="#ff5a5f"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Asteroid Watch</span>
          <span class="brand-sub">Near-Earth asteroid tracker</span>
        </span>
      </a>

      <nav class="date-nav" aria-label="Choose a day">
        <button class="icon-btn" id="prevDay" aria-label="Previous day" title="Previous day"><svg class="icon"><use href="#i-left"/></svg></button>
        <label class="date-pill" title="Pick a date">
          <span class="date-main" id="dateLabel">—</span>
          <span class="date-hint" id="dateHint"></span>
          <input type="date" id="dateInput" aria-label="Date">
        </label>
        <button class="icon-btn" id="nextDay" aria-label="Next day" title="Next day"><svg class="icon"><use href="#i-right"/></svg></button>
        <button class="chip-btn" id="todayBtn">Today</button>
      </nav>
    </header>

    <aside class="stats" id="stats" aria-label="Today at a glance"></aside>

    <section class="stage" aria-label="3D view">
      <div class="overlay" id="overlay" hidden></div>

      <div class="legend glass-lite" id="legend">
        <span class="lg-item"><i class="lg-dot safe"></i>Asteroid</span>
        <span class="lg-item"><i class="lg-dot hazard"></i><svg class="icon lg-warn"><use href="#i-warning"/></svg>Potentially hazardous</span>
        <span class="lg-item"><i class="lg-trail"></i>Path (bright = where it's been)</span>
        <span class="lg-note">Log distance scale · 1 LD = Earth–Moon distance, 384,400 km</span>
      </div>

      <div class="scene-tools glass-lite" role="toolbar" aria-label="View controls">
        <button class="tool-btn" id="resetView" title="Reset view"><svg class="icon"><use href="#i-globe"/></svg></button>
        <button class="tool-btn is-on" id="toggleLabels" title="Toggle labels" aria-pressed="true"><svg class="icon"><use href="#i-tag"/></svg></button>
        <button class="tool-btn is-on" id="toggleTrails" title="Toggle trajectories" aria-pressed="true"><svg class="icon"><use href="#i-orbit"/></svg></button>
        <button class="tool-btn is-on" id="toggleRotate" title="Auto-rotate" aria-pressed="true"><svg class="icon"><use href="#i-rotate"/></svg></button>
      </div>
    </section>

    <aside class="side glass" id="side">
      <section class="view list-view" id="listView">
        <div class="side-head">
          <div>
            <h2 id="listTitle">Today’s flybys</h2>
            <p class="muted" id="listSub">Loading…</p>
          </div>
        </div>
        <div class="list-controls">
          <div class="seg" role="radiogroup" aria-label="Filter">
            <button role="radio" aria-checked="true" data-filter="all" class="is-active">All <span class="seg-count" id="countAll">0</span></button>
            <button role="radio" aria-checked="false" data-filter="hazard"><svg class="icon"><use href="#i-warning"/></svg>Hazardous <span class="seg-count" id="countHaz">0</span></button>
          </div>
          <label class="sort">
            <span class="sr-only">Sort by</span>
            <select id="sortSel">
              <option value="distance">Closest first</option>
              <option value="time">By time</option>
              <option value="size">Largest first</option>
              <option value="speed">Fastest first</option>
            </select>
          </label>
        </div>
        <ul class="neo-list" id="neoList" aria-label="Asteroids"></ul>
      </section>
      <section class="view detail-view" id="detailView" hidden aria-live="polite"></section>
    </aside>

    <footer class="timeline glass" id="timeline">
      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg class="icon"><use href="#i-play"/></svg>
      </button>
      <div class="speeds" id="speeds" role="radiogroup" aria-label="Playback speed"></div>
      <div class="tl-body">
        <div class="tl-meta">
          <span class="tl-mode" id="tlMode">Live</span>
          <span class="tl-time" id="tlTime">--:--</span>
          <span class="tl-date" id="tlDate"></span>
          <span class="tl-tz" id="tlTz"></span>
        </div>
        <div class="tl-track" id="track" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="tl-rail"><div class="tl-progress" id="tlProgress"></div></div>
          <div class="tl-hours" id="tlHours"></div>
          <div class="tl-ticks" id="tlTicks"></div>
          <div class="tl-now" id="tlNow" hidden title="Now"></div>
          <div class="tl-head" id="tlHead"></div>
        </div>
      </div>
      <button class="live-btn" id="liveBtn" title="Jump to the current moment"><span class="pulse"></span>Live</button>
    </footer>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
